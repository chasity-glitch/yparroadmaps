<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRYC Future You · 8th Grade</title>
<style>
:root {
  --gold: #c9a800; --gold-light: #f0c917; --gold-pale: #fef9e0;
  --black: #1a1a1a; --white: #ffffff;
  --pink: #ed125f; --pink-dark: #d51056;
  --gray-100: #f5f5f5; --gray-200: #e8e8e8; --gray-400: #666;
  --gray-600: #444; --gray-800: #1a1a1a;
  --radius: 12px; --shadow: 0 2px 8px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: ProximaNova, sans-serif; background: #f7f7f5; color: var(--black); min-height: 100vh; }
#app { min-height: 100vh; }
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100vh; }

/* LANDING */
.landing-header { background: #fff; padding: 32px 24px 0; text-align: center; }
.bryc-wordmark { font-weight: 900; font-size: 12px; letter-spacing: .18em; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
.landing-title { font-weight: 900; font-size: clamp(28px,6vw,48px); color: var(--black); line-height: 1.05; margin-bottom: 6px; }
.landing-title span { color: var(--gold); }
.landing-sub { font-size: 14px; color: var(--gray-400); margin-bottom: 32px; }



.divider-row { display: flex; align-items: center; gap: 12px; padding: 28px 24px 0; }
.divider-line { flex: 1; height: 1px; background: #1e1e1e; }
.divider-text { font-size: 11px; color: var(--gray-400); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }

.login-card { margin: 20px 24px 32px; background: #fff; border-radius: var(--radius); padding: 24px; border: 1px solid #e0e0e0; box-shadow: var(--shadow); }
.login-card h3 { font-size: 15px; font-weight: 800; color: var(--black); margin-bottom: 14px; }

.role-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.role-tab { flex: 1; padding: 8px 4px; border-radius: 6px; border: 1.5px solid #333; background: transparent; color: var(--gray-400); font-family: ProximaNova, sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: .06em; transition: all .15s; }
.role-tab.active { border-color: var(--gold); background: rgba(240,201,23,.1); color: var(--gold); }

.search-wrap { position: relative; margin-bottom: 12px; }
.search-input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1.5px solid #ddd; background: #fafafa; color: var(--black); font-family: ProximaNova, sans-serif; font-size: 15px; outline: none; transition: border-color .15s; }
.search-input::placeholder { color: #aaa; }
.search-input:focus { border-color: var(--gold); }
.fellow-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff; border: 1.5px solid #ddd; border-radius: 8px; max-height: 210px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
.fellow-dropdown.open { display: block; }
.fellow-option { padding: 10px 16px; font-size: 14px; cursor: pointer; color: var(--black); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f0f0f0; transition: background .1s; }
.fellow-option:last-child { border-bottom: none; }
.fellow-option:hover { background: #fef9e0; }
.grade-badge { font-size: 11px; font-weight: 700; color: var(--gold); background: rgba(240,201,23,.12); padding: 2px 8px; border-radius: 20px; }

.selected-fellow { background: var(--gold-pale); border: 1.5px solid var(--gold); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; display: none; align-items: center; justify-content: space-between; }
.selected-fellow.visible { display: flex; }
.selected-fellow-name { font-weight: 700; font-size: 14px; color: var(--black); }
.selected-fellow-grade { font-size: 12px; color: var(--gold); font-weight: 700; }
.clear-btn { background: none; border: none; color: #999; cursor: pointer; font-size: 20px; line-height: 1; padding: 0 2px; }

.pin-input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1.5px solid #ddd; background: #fafafa; color: var(--black); font-family: ProximaNova, sans-serif; font-size: 15px; letter-spacing: .2em; outline: none; transition: border-color .15s; margin-bottom: 12px; }
.pin-input:focus { border-color: var(--gold); }
.pin-input::placeholder { letter-spacing: normal; color: #aaa; }

.btn-primary { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--gold); color: #000; font-family: ProximaNova, sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; transition: background .15s; letter-spacing: .04em; }
.btn-primary:hover { background: #e8c010; }
.error-msg { font-size: 13px; color: var(--pink); font-weight: 700; margin-top: 10px; text-align: center; min-height: 18px; }

/* ROADMAP HEADER */
.roadmap-header { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.header-name { font-size: 16px; font-weight: 800; color: var(--black); }
.header-meta { font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: .06em; margin-top: 1px; }
.autosave-pill { font-size: 11px; font-weight: 700; color: #aaa; min-height: 14px; margin-top: 2px; transition: color .3s; }
.autosave-pill.saving { color: var(--gold); }
.autosave-pill.saved { color: #22c55e; }
.autosave-pill.err { color: var(--pink); }
.btn-logout { background: #f5f5f5; border: 1px solid #e0e0e0; color: #666; font-family: ProximaNova, sans-serif; font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 6px; cursor: pointer; transition: all .15s; }
.btn-logout:hover { border-color: var(--pink); color: var(--pink); }
.card { background: #fff; border: 1px solid #e8e8e8; border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-title { font-size: 13px; font-weight: 800; color: var(--gold); letter-spacing: .04em; margin-bottom: 14px; }
.section-label { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #888; margin-bottom: 10px; }
.save-row { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
.save-btn { background: var(--gold); color: #000; border: none; border-radius: 8px; padding: 12px 24px; font-family: ProximaNova, sans-serif; font-size: 14px; font-weight: 800; cursor: pointer; transition: background .15s; }
.save-btn:hover { background: #e8c010; }
.save-btn:disabled { opacity: .4; cursor: default; }
.field-label { font-size: 10px; font-weight: 800; color: #888; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 5px; margin-top: 14px; }
.text-input { width: 100%; background: #fafafa; border: 1.5px solid #e0e0e0; border-radius: 6px; padding: 9px 12px; color: var(--black); font-family: ProximaNova, sans-serif; font-size: 14px; outline: none; transition: border-color .15s; }
.text-input:focus { border-color: var(--gold); }
.text-input:disabled { opacity: .45; }
.text-input::placeholder { color: #bbb; }
.pm-topbar { background: var(--gold); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
.pm-topbar h2 { font-size: 18px; font-weight: 900; color: #000; }
.pm-topbar button { background: rgba(0,0,0,.1); border: none; color: #000; font-family: ProximaNova, sans-serif; font-size: 12px; font-weight: 800; padding: 7px 14px; border-radius: 6px; cursor: pointer; }
.pm-controls { padding: 14px 20px; display: flex; gap: 8px; border-bottom: 1px solid #e8e8e8; background: #fff; }
.pm-search { flex: 1; background: #fafafa; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 10px 14px; color: var(--black); font-family: ProximaNova, sans-serif; font-size: 14px; outline: none; }
.pm-search:focus { border-color: var(--gold); }
.pm-search::placeholder { color: #aaa; }
.pm-grade-sel { background: #fafafa; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; color: var(--black); font-family: ProximaNova, sans-serif; font-size: 13px; outline: none; cursor: pointer; }
.pm-prompt-section { padding: 16px 20px 0; background: #f7f7f5; }
.pm-prompt-card { background: #fff; border: 1px solid #e8e8e8; border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.pm-prompt-card h3 { font-size: 13px; font-weight: 800; color: var(--gold); margin-bottom: 10px; }
.prompt-textarea { width: 100%; background: #fafafa; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 12px 14px; color: var(--black); font-family: ProximaNova, sans-serif; font-size: 14px; outline: none; resize: vertical; min-height: 80px; transition: border-color .15s; margin-bottom: 10px; }
.prompt-textarea:focus { border-color: var(--gold); }
.fellow-list { padding: 14px 20px; flex: 1; background: #f7f7f5; }
.fellow-item { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 13px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all .15s; box-shadow: var(--shadow); }
.fellow-item:hover { border-color: var(--gold); background: var(--gold-pale); }
.fellow-item-name { font-size: 15px; font-weight: 700; color: var(--black); }
.fellow-item-meta { font-size: 12px; color: #888; margin-top: 2px; }
.fellow-arrow { color: #ccc; font-size: 12px; }
.pts-badge { display: inline-block; background: var(--gold-pale); color: var(--gold); border: 1px solid #e8d500; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 20px; margin-left: 6px; }
.back-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; color: var(--gold); font-family: ProximaNova, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; }
.hidden { display: none !important; }
.loading-screen { position: fixed; inset: 0; background: #fff; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.loading-screen.hidden { display: none !important; }
.loading-wordmark { font-size: 12px; font-weight: 900; letter-spacing: .18em; color: var(--gold); text-transform: uppercase; }
.loading-title { font-size: 26px; font-weight: 900; color: var(--black); }
.loading-spinner { width: 40px; height: 40px; border: 3px solid #f0f0f0; border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
.loading-msg { font-size: 13px; color: #aaa; font-weight: 700; }
.back-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; color: var(--gold); font-family: ProximaNova, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; }

@media (min-width: 700px) {
  .screen { max-width: 680px; margin: 0 auto; }
  body { background: #eeeee9; }
  .tops-grid { grid-template-columns: repeat(3, 1fr); }
}
.loading-screen { position: fixed; inset: 0; background: #fff; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.loading-screen.hidden { display: none !important; }
/* SELF TOOLKIT REFLECTION */
.tk-intro { font-size: 13px; color: #666; line-height: 1.45; margin-bottom: 4px; }
.tk-step { display: flex; align-items: center; gap: 8px; margin: 18px 0 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── FUTURE YOU TAB ─────────────────────────────────────────── */
.fy-hero { background: var(--black); color: #fff; border-radius: var(--radius); padding: 20px; margin-bottom: 16px; position: relative; overflow: hidden; }
.fy-hero::after { content: ''; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, var(--gold-light) 0%, rgba(240,201,23,0) 70%); opacity: .35; }
.fy-hero-kicker { font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 4px; }
.fy-hero-title { font-size: 22px; font-weight: 900; line-height: 1.15; margin-bottom: 6px; }
.fy-hero-sub { font-size: 13px; color: rgba(255,255,255,.7); line-height: 1.45; max-width: 520px; }
.fy-stops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; position: relative; z-index: 1; }
.fy-stop { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 8px; font-size: 11px; font-weight: 800; color: rgba(255,255,255,.75); text-align: left; cursor: pointer; font-family: ProximaNova, sans-serif; }
.fy-stop b { display: block; font-size: 16px; margin-bottom: 2px; }
.fy-stop.done { background: var(--gold-light); color: #000; border-color: var(--gold-light); }
.fy-sec { scroll-margin-top: 12px; }
.fy-sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.fy-sec-num { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #888; }
.fy-sec-meta { font-size: 11px; font-weight: 800; color: var(--gold); }
.fy-q { font-size: 15px; font-weight: 800; color: var(--black); margin: 18px 0 4px; line-height: 1.3; }
.fy-q:first-child { margin-top: 0; }
.fy-hint { font-size: 12px; color: #888; margin-bottom: 8px; line-height: 1.4; }
.fy-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fy-chip { padding: 8px 12px; border-radius: 999px; border: 1.5px solid #e0e0e0; background: #fafafa; font-family: ProximaNova, sans-serif; font-size: 13px; font-weight: 700; color: var(--black); cursor: pointer; transition: all .12s; }
.fy-chip:hover:not(:disabled) { border-color: var(--gold); }
.fy-chip.on { border-color: var(--black); background: var(--black); color: #fff; }
.fy-chip:disabled { cursor: default; opacity: .7; }
.fy-chip.sm { padding: 5px 10px; font-size: 12px; }
.fy-ta { width: 100%; background: #fafafa; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; font-family: ProximaNova, sans-serif; font-size: 14px; color: var(--black); outline: none; resize: vertical; min-height: 64px; line-height: 1.4; }
.fy-ta:focus { border-color: var(--gold); }
.fy-ta:disabled { opacity: .7; }

/* mood meter */
.fy-mood { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 420px; }
.fy-mq { border: 2px solid transparent; border-radius: 10px; padding: 12px; text-align: left; cursor: pointer; font-family: ProximaNova, sans-serif; color: #1a1a1a; min-height: 66px; transition: transform .1s; }
.fy-mq:hover:not(:disabled) { transform: translateY(-1px); }
.fy-mq b { display: block; font-size: 13px; font-weight: 900; }
.fy-mq span { font-size: 11px; font-weight: 700; opacity: .75; }
.fy-mq.on { border-color: var(--black); box-shadow: 0 0 0 2px #fff inset; }
.fy-mq:disabled { cursor: default; }
.fy-mq.red { background: #f8b4b4; } .fy-mq.yellow { background: #fbe38e; }
.fy-mq.blue { background: #a9cdf2; } .fy-mq.green { background: #a8dfb5; }
.fy-mood-axis { display: flex; justify-content: space-between; max-width: 420px; font-size: 10px; font-weight: 800; color: #aaa; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.fy-stamp { display: inline-flex; align-items: center; gap: 6px; background: var(--gold-pale); color: #7a6500; border: 1px dashed var(--gold); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 800; margin-top: 14px; }

/* deck */
.fy-sparks { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.fy-spark { flex-shrink: 0; max-width: 220px; text-align: left; background: var(--gold-pale); border: 1px solid #efdf86; border-radius: 10px; padding: 10px 12px; font-family: ProximaNova, sans-serif; font-size: 12px; font-weight: 700; color: #5c4c00; cursor: pointer; line-height: 1.35; }
.fy-spark:hover { border-color: var(--gold); }
.fy-deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 14px; }
.fy-card { background: #fff; border: 1.5px solid #e8e8e8; border-radius: 12px; padding: 14px; position: relative; display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
.fy-card.editing { grid-column: 1 / -1; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-pale); }
.fy-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fy-card-type { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #888; display: flex; align-items: center; gap: 6px; }
.fy-card-icon { font-size: 18px; }
.fy-card-org { font-size: 16px; font-weight: 900; line-height: 1.2; }
.fy-card-role { font-size: 12px; font-weight: 700; color: var(--gold); }
.fy-card-flex { font-size: 13px; color: #444; line-height: 1.4; margin-top: 4px; }
.fy-card-flex.empty { color: #bbb; font-style: italic; }
.fy-card-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 8px; }
.fy-tag { font-size: 10px; font-weight: 800; background: #f3f3f3; color: #555; padding: 3px 7px; border-radius: 4px; }
.fy-card-btn { background: none; border: none; font-family: ProximaNova, sans-serif; font-size: 12px; font-weight: 800; color: #888; cursor: pointer; padding: 2px 4px; }
.fy-card-btn:hover { color: var(--black); }
.fy-card-btn.danger { color: var(--pink); }
.fy-add { border: 2px dashed #ddd; background: #fafafa; border-radius: 12px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: ProximaNova, sans-serif; font-size: 13px; font-weight: 800; color: #888; cursor: pointer; }
.fy-add:hover { border-color: var(--gold); color: var(--black); }
.fy-add b { font-size: 26px; line-height: 1; }
.fy-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
.fy-edit-grid .full { grid-column: 1 / -1; }
.fy-range { width: 100%; accent-color: var(--black); }
.fy-range-val { font-size: 13px; font-weight: 800; }
.fy-done-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
.fy-btn { background: var(--gold); color: #000; border: none; border-radius: 8px; padding: 10px 18px; font-family: ProximaNova, sans-serif; font-size: 13px; font-weight: 800; cursor: pointer; }
.fy-btn:hover { background: #e8c010; }
.fy-btn.dark { background: var(--black); color: #fff; }
.fy-btn.ghost { background: #f1f1f1; color: #333; }

/* level meter */
.fy-level { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.fy-lv { border: 1.5px solid #e0e0e0; background: #fafafa; border-radius: 10px; padding: 10px 8px; text-align: center; font-family: ProximaNova, sans-serif; cursor: pointer; color: var(--black); }
.fy-lv b { display: block; font-size: 20px; font-weight: 900; }
.fy-lv span { font-size: 11px; font-weight: 700; color: #777; }
.fy-lv.on { border-color: var(--black); background: var(--black); color: #fff; }
.fy-lv.on span { color: rgba(255,255,255,.7); }
.fy-lv:disabled { cursor: default; }
.fy-reveal { margin-top: 12px; background: #fafafa; border-radius: 10px; padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.fy-reveal-num { font-size: 40px; font-weight: 900; line-height: 1; color: var(--black); }
.fy-reveal-num small { display: block; font-size: 10px; font-weight: 800; color: #888; letter-spacing: .1em; text-transform: uppercase; }
.fy-reveal-msg { font-size: 13px; line-height: 1.45; color: #444; }
.fy-meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.fy-meter { font-size: 11px; font-weight: 800; color: #666; }
.fy-meter-bar { height: 6px; background: #ececec; border-radius: 3px; margin-top: 4px; overflow: hidden; }
.fy-meter-bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }

/* moves */
.fy-move { background: #fff; border: 1.5px solid #e8e8e8; border-radius: 12px; padding: 14px; margin-top: 10px; }
.fy-move-title { font-size: 16px; font-weight: 900; }
.fy-pipe { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
.fy-pipe button { flex: 1 1 0; min-width: 88px; padding: 8px 6px; border-radius: 8px; border: 1.5px solid #e0e0e0; background: #fafafa; font-family: ProximaNova, sans-serif; font-size: 11px; font-weight: 800; color: #666; cursor: pointer; }
.fy-pipe button.on { background: var(--black); border-color: var(--black); color: #fff; }
.fy-pipe button.on.win { background: #22a04b; border-color: #22a04b; }
.fy-pipe button:disabled { cursor: default; }
.fy-due { font-size: 12px; font-weight: 800; color: #888; }
.fy-due.late { color: var(--pink); }

/* sealed note */
.fy-envelope { background: repeating-linear-gradient(135deg, #fff9dc 0 14px, #fef3b8 14px 28px); border: 1.5px solid #efdf86; border-radius: 12px; padding: 22px; text-align: center; }
.fy-envelope b { display: block; font-size: 30px; margin-bottom: 4px; }
.fy-envelope div { font-size: 14px; font-weight: 800; }
.fy-envelope span { font-size: 12px; color: #7a6500; }

@media (max-width: 560px) {
  .fy-stops { grid-template-columns: repeat(2, 1fr); }
  .fy-edit-grid { grid-template-columns: 1fr; }
  .fy-meters { grid-template-columns: 1fr; }
}

/* ── TEAM INSIGHTS ──────────────────────────────────────────── */
.pm-viewtabs { display: flex; gap: 6px; padding: 14px 20px 0; background: #fff; }
.pm-viewtab { padding: 9px 16px; border-radius: 8px 8px 0 0; border: 1px solid #e8e8e8; border-bottom: none; background: #f5f5f5; font-family: ProximaNova, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #888; cursor: pointer; }
.pm-viewtab.active { background: #f7f7f5; color: var(--black); }
.ins-wrap { padding: 16px 20px 40px; background: #f7f7f5; flex: 1; }
.ins-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.ins-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
.ins-tile { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 14px; }
.ins-tile-num { font-size: 28px; font-weight: 900; line-height: 1; }
.ins-tile-lbl { font-size: 11px; font-weight: 800; color: #888; text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
.ins-tile-sub { font-size: 12px; color: #999; margin-top: 2px; }
.ins-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 16px; }
.ins-card h4 { font-size: 13px; font-weight: 900; margin-bottom: 2px; }
.ins-card p.ins-sub { font-size: 12px; color: #888; margin-bottom: 12px; }
.ins-bar { display: grid; grid-template-columns: 130px 1fr 34px; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: #444; position: relative; }
.ins-bar-track { height: 14px; background: #f1f1f1; border-radius: 0 4px 4px 0; }
.ins-bar-fill { height: 100%; background: var(--gold); border-radius: 0 4px 4px 0; min-width: 2px; }
.ins-bar-n { font-weight: 800; color: var(--black); text-align: right; }
.ins-bar[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 138px; top: -26px; background: var(--black); color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; z-index: 5; pointer-events: none; }
.ins-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.ins-quotes { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
.ins-quote { border-left: 3px solid var(--gold); padding: 6px 10px; font-size: 13px; line-height: 1.45; background: #fafafa; border-radius: 0 6px 6px 0; }
.ins-quote cite { display: block; font-style: normal; font-size: 11px; font-weight: 800; color: #888; margin-top: 4px; }
.ins-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.ins-table th { text-align: left; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #888; padding: 6px; border-bottom: 1px solid #e8e8e8; }
.ins-table td { padding: 7px 6px; border-bottom: 1px solid #f2f2f2; }
.ins-table tr.click { cursor: pointer; } .ins-table tr.click:hover td { background: var(--gold-pale); }
.ins-dl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.ins-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.ins-head h3 { font-size: 18px; font-weight: 900; }
.fy-badge { display: inline-block; background: #f1f1f1; color: #555; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 20px; margin-left: 6px; }
.fy-badge.ok { background: #e3f5e8; color: #1c7a3a; }
#screen-pm { max-width: 1100px; }
.fy-passport { display: flex; gap: 6px; margin-top: 14px; overflow-x: auto; position: relative; z-index: 1; }
.fy-pass { flex: 1 0 104px; border: 1.5px dashed rgba(255,255,255,.25); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 1px; }
.fy-pass span { font-size: 18px; line-height: 1.2; color: rgba(255,255,255,.5); }
.fy-pass b { font-size: 11px; font-weight: 800; color: #fff; }
.fy-pass i { font-style: normal; font-size: 10px; color: rgba(255,255,255,.55); font-weight: 700; }
.fy-pass.got { border-style: solid; border-color: var(--gold-light); background: rgba(240,201,23,.12); }
.fy-pass.got i { color: var(--gold-light); }
.fy-pass.open { border-style: solid; border-color: #fff; }
.fy-pass.open span { color: var(--gold-light); }
.fy-past { font-size: 13px; color: #444; background: #fafafa; border-radius: 8px; padding: 8px 10px; margin-top: 6px; line-height: 1.4; }
.fy-past div { color: #666; margin-top: 2px; }
.fy-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px 0 2px; vertical-align: 0; }
.fy-dot.yellow { background: #f2c94c; } .fy-dot.red { background: #e57373; } .fy-dot.green { background: #5fbf7a; } .fy-dot.blue { background: #5b9be0; }
.fy-then { background: var(--gold-pale); border: 1px solid #efdf86; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.45; margin-top: 16px; }
.fy-resume { margin-top: 12px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; overflow-x: auto; }
.ev-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; border: 1.5px solid #eee; border-radius: 10px; margin-top: 8px; }
.ev-row.on { border-color: var(--gold); background: var(--gold-pale); }
.ev-row b { display: block; font-size: 14px; }
.ev-row span { font-size: 12px; color: #888; }
.pm-active { padding: 12px 20px; background: #fff; border-bottom: 1px solid #eee; font-size: 13px; color: #444; }
@media (max-width: 560px) { .pm-controls { flex-wrap: wrap; } .pm-search { flex-basis: 100%; } .ins-bar { grid-template-columns: 110px 1fr 30px; } }
.tk-empty { font-size: 13px; color: #aaa; font-style: italic; padding: 6px 0; }

/* ── FUTURE YOU v2 ───────────────────────────────────────────── */
.fy-ico { flex-shrink: 0; display: block; }
.fy-hero-title { font-size: 24px; }
.fy-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; position: relative; z-index: 1; }
.fy-step { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.16); border-radius: 12px; padding: 12px; }
.fy-step-dot { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,.5); color: #fff; flex-shrink: 0; }
.fy-step-txt { font-size: 13px; font-weight: 800; color: #fff; line-height: 1.2; }
.fy-step-txt span { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.55); margin-bottom: 2px; }
.fy-step.done { background: rgba(240,201,23,.14); border-color: var(--gold-light); }
.fy-step.done .fy-step-dot { background: var(--gold-light); border-color: var(--gold-light); color: #000; }
.fy-step.done .fy-step-txt span { color: var(--gold-light); }
.fy-progress { height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; margin-top: 14px; overflow: hidden; position: relative; z-index: 1; }
.fy-progress i { display: block; height: 100%; background: var(--gold-light); border-radius: 3px; transition: width .3s; }
.fy-progress-lbl { font-size: 11px; font-weight: 800; color: rgba(255,255,255,.6); margin-top: 6px; letter-spacing: .06em; position: relative; z-index: 1; }

.fy-sec-head { display: flex; align-items: center; gap: 12px; margin: 26px 0 12px; }
.fy-sec-badge { width: 42px; height: 42px; border-radius: 12px; background: var(--black); color: var(--gold-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.fy-sec-titles { flex: 1; }
.fy-sec-kicker { font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #888; }
.fy-sec-title { font-size: 20px; font-weight: 900; color: var(--black); line-height: 1.15; }
.fy-sec-meta { font-size: 12px; font-weight: 800; color: #7a6500; background: var(--gold-pale); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.fy-q { font-size: 15px; font-weight: 800; margin: 22px 0 8px; }
.fy-q.sm { font-size: 13px; margin: 14px 0 6px; }
.fy-pick { font-size: 11px; font-weight: 800; color: #999; letter-spacing: .04em; margin-left: 4px; }
.fy-hint { margin-top: -4px; }

/* mood meter grid with axes */
.fy-mood-wrap { display: flex; gap: 8px; max-width: 460px; }
.fy-mood-y { display: flex; flex-direction: column; justify-content: space-between; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 800; color: #aaa; letter-spacing: .08em; text-transform: uppercase; padding: 6px 0 22px; }
.fy-mood-wrap > div:last-child { flex: 1; }
.fy-mood { max-width: none; }
.fy-mq { min-height: 74px; }
.fy-mq span { display: block; margin-top: 3px; font-size: 12px; opacity: .85; }
.fy-mood-x { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; color: #aaa; letter-spacing: .08em; text-transform: uppercase; margin-top: 5px; }
.fy-level.five { grid-template-columns: repeat(5, 1fr); }

/* sparks */
.fy-spark { display: flex; flex-direction: column; gap: 2px; min-width: 150px; }
.fy-spark span { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #9a8300; }

/* cards */
.fy-card-top { align-items: flex-start; }
.fy-card-org { font-size: 17px; }
.fy-card-type { letter-spacing: .06em; margin-top: 2px; }
.fy-card-type .fy-card-role { color: var(--gold); text-transform: none; letter-spacing: 0; font-size: 12px; }
.fy-card-verbs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.fy-card-verbs span { font-size: 11px; font-weight: 800; background: var(--black); color: #fff; padding: 2px 8px; border-radius: 999px; }
.fy-ed-q { font-size: 14px; font-weight: 800; color: var(--black); margin: 18px 0 8px; }
.fy-ed-q.first { margin-top: 4px; }
.fy-range-row { display: flex; align-items: center; gap: 12px; max-width: 420px; }
.fy-range-val { min-width: 56px; text-align: right; }

/* rubric rating */
.fy-rating { display: grid; grid-template-columns: 110px 1fr; gap: 16px; margin-top: 18px; background: var(--black); color: #fff; border-radius: 12px; padding: 16px; }
.fy-rating-num { font-size: 46px; font-weight: 900; line-height: 1; color: var(--gold-light); }
.fy-rating-num small { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 6px; }
.fy-rating-num em { display: block; font-style: normal; font-size: 14px; color: #fff; margin-top: 4px; }
.fy-rating-src { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.55); }
.fy-rating-msg { font-size: 14px; font-weight: 700; margin-top: 6px; line-height: 1.4; }
.fy-rating-msg span { color: rgba(255,255,255,.6); font-weight: 400; }
.fy-rating-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.fy-rating-stats span { font-size: 12px; background: rgba(255,255,255,.1); padding: 4px 8px; border-radius: 6px; }
.fy-rating-stats b { color: var(--gold-light); }
.fy-rating-next { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 10px; line-height: 1.4; }
.fy-rubric { margin-top: 8px; font-size: 12px; color: #555; }
.fy-rubric summary { cursor: pointer; font-weight: 800; color: #888; padding: 4px 0; }
.fy-rubric div { padding: 4px 0; border-bottom: 1px solid #f0f0f0; }

/* moves */
.fy-move-head { display: flex; gap: 10px; align-items: flex-start; }
.fy-move-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--gold-pale); color: #7a6500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.fy-move-kind { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #888; }
.fy-link { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--gold); font-weight: 800; }
.fy-kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.fy-kind { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; padding: 14px; border: 2px dashed #ddd; background: #fafafa; border-radius: 12px; font-family: ProximaNova, sans-serif; font-size: 13px; font-weight: 800; color: var(--black); cursor: pointer; }
.fy-kind:hover { border-color: var(--gold); border-style: solid; background: var(--gold-pale); }
.fy-kind .fy-ico { color: var(--gold); }

/* note */
.fy-envelope { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5c4c00; }
.fy-envelope.open { align-items: stretch; text-align: left; }
.fy-env-h { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
.fy-env-q { font-size: 12px; font-weight: 800; color: #7a6500; margin-top: 10px; }
.fy-env-a { font-size: 15px; color: #1a1a1a; line-height: 1.45; }

/* passport (multi-event sites) */
.fy-pass b { font-size: 12px; }

@media (max-width: 560px) {
  .fy-steps { grid-template-columns: repeat(2, 1fr); }
  .fy-kinds { grid-template-columns: 1fr; }
  .fy-rating { grid-template-columns: 1fr; }
  .fy-level.five { grid-template-columns: repeat(3, 1fr); }
}

.fy-mood2 { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 6px; max-width: 480px; align-items: stretch; }
.fy-my { font-size: 10px; font-weight: 800; color: #999; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; line-height: 1.2; }
.fy-mx { font-size: 10px; font-weight: 800; color: #999; letter-spacing: .06em; text-transform: uppercase; text-align: center; }

/* ── v3: game feel ── */
.fy-card { border-top-width: 5px; }
.fy-card.t-sport { border-top-color: #f28c28; } .fy-card.t-arts { border-top-color: #ed125f; } .fy-card.t-club { border-top-color: #f0c917; }
.fy-card.t-faith, .fy-card.t-volunteer { border-top-color: #1fa3a3; } .fy-card.t-job, .fy-card.t-family { border-top-color: #1a1a1a; }
.fy-card.t-bryc { border-top-color: #c9a800; } .fy-card.t-program { border-top-color: #7fc8c8; } .fy-card.t-award { border-top-color: #f0c917; background: var(--gold-pale); }
.fy-card:not(.editing) { transition: transform .15s, box-shadow .15s; }
.fy-card:not(.editing):hover { transform: translateY(-2px) rotate(-.4deg); box-shadow: 0 8px 18px rgba(0,0,0,.08); }
.fy-card.deal { animation: fyDeal .5s cubic-bezier(.2,.8,.3,1.25) both; }
.fy-meter2 { margin-top: 18px; background: #fafafa; border: 1.5px solid #eee; border-radius: 12px; padding: 14px; }
.fy-meter2-top { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #888; margin-bottom: 8px; }
.fy-meter2-top b { color: var(--black); letter-spacing: .04em; } .fy-meter2-top b.dim { color: #bbb; }
.fy-bar { position: relative; height: 12px; background: #e8e8e8; border-radius: 6px; margin-bottom: 20px; }
.fy-bar i { display: block; height: 100%; background: var(--gold-light); border-radius: 6px; transition: width .6s cubic-bezier(.2,.8,.3,1.2); }
.fy-bar .m { position: absolute; top: 15px; transform: translateX(-50%); font-size: 10px; font-weight: 800; color: #999; }
.fy-bar .m::before { content: ''; position: absolute; top: -17px; left: 50%; width: 2px; height: 14px; background: #ccc; }
.fy-rating-stats.light span { background: #fff; border: 1px solid #eee; color: #444; } .fy-rating-stats.light b { color: var(--black); }
.fy-reveal-cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; background: var(--black); color: #fff; border-radius: 12px; padding: 14px 16px; }
.fy-reveal-cta b { display: block; font-size: 15px; } .fy-reveal-cta span { font-size: 12px; color: rgba(255,255,255,.7); }
.fy-reveal-cta .fy-btn { background: var(--gold-light); color: #000; } .fy-reveal-cta .fy-btn:disabled { opacity: .35; cursor: default; }
.fy-rating.flip { animation: fyFlip .7s ease both; }
.fy-move.ticket { position: relative; background: #fff; border: 1.5px solid #e8e8e8; border-left: 2px dashed #d8d8d8; }
.fy-move.ticket::before, .fy-move.ticket::after { content: ''; position: absolute; left: -9px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 1.5px solid #e8e8e8; }
.fy-move.ticket::before { top: -8px; } .fy-move.ticket::after { bottom: -8px; }
.fy-stub { width: 54px; flex-shrink: 0; background: var(--black); color: #fff; border-radius: 10px; text-align: center; padding: 6px 4px; line-height: 1.05; }
.fy-stub small { display: block; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.6); }
.fy-stub b { display: block; font-size: 13px; font-weight: 900; color: var(--gold-light); } .fy-stub b + b { font-size: 22px; color: #fff; }
.fy-stub.late { background: var(--pink); } .fy-stub.late b { color: #fff; }
.fy-envelope { position: relative; overflow: hidden; }
.fy-seal-stamp { position: absolute; right: 14px; top: 12px; transform: rotate(12deg); border: 3px solid var(--pink); color: var(--pink); font-weight: 900; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; opacity: .85; }
.fy-envelope.sealing { animation: fyPop .5s ease; } .fy-envelope.sealing .fy-seal-stamp { animation: fyStamp .6s .25s cubic-bezier(.2,.8,.3,1.4) both; }
.fy-toast { position: fixed; right: 16px; z-index: 300; background: #000; color: var(--gold-light); font-weight: 900; font-size: 14px; padding: 11px 16px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,.25); opacity: 0; animation: fyToast 2.6s ease forwards; max-width: 300px; }
.fy-toast.big { background: var(--gold-light); color: #000; font-size: 16px; }
.fy-conf { position: fixed; top: -12px; height: 10px; z-index: 400; pointer-events: none; border-radius: 2px; animation: fyFall 1.8s ease-in forwards; }
@keyframes fyDeal { from { opacity: 0; transform: translateY(-24px) rotate(-5deg) scale(.92); } to { opacity: 1; transform: none; } }
@keyframes fyFlip { from { opacity: 0; transform: perspective(600px) rotateX(-70deg); } to { opacity: 1; transform: none; } }
@keyframes fyPop { 50% { transform: scale(1.06); } }
@keyframes fyStamp { from { opacity: 0; transform: rotate(12deg) scale(2.4); } to { opacity: .85; transform: rotate(12deg) scale(1); } }
@keyframes fyToast { 0% { opacity: 0; transform: translateY(-10px); } 10% { opacity: 1; transform: none; } 82% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px); } }
@keyframes fyFall { to { transform: translate(var(--x), 105vh) rotate(var(--r)); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .fy-card.deal, .fy-rating.flip, .fy-envelope.sealing, .fy-envelope.sealing .fy-seal-stamp, .fy-bar i { animation: none; transition: none; } }
@media (max-width: 560px) { .fy-reveal-cta { flex-direction: column; align-items: stretch; } }

/* ── v4: road map + one stop at a time ── */
.fy-map { background: var(--black); color: #fff; border-radius: 18px; padding: 22px 22px 18px; position: relative; overflow: hidden; }
.fy-map::before { content: ''; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(240,201,23,.35), rgba(240,201,23,0) 70%); }
.fy-map-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; }
.fy-map-title { font-size: 28px; font-weight: 900; line-height: 1.1; text-wrap: balance; }
.fy-map-count { text-align: right; font-size: 18px; font-weight: 900; color: rgba(255,255,255,.6); line-height: 1; }
.fy-map-count b { font-size: 40px; color: var(--gold-light); } .fy-map-count small { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-top: 4px; }
.fy-road { position: relative; height: 240px; margin: 14px 0 6px; }
.fy-road-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fy-road-base { fill: none; stroke: #333; stroke-width: 34; stroke-linecap: round; }
.fy-road-line { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 3; stroke-dasharray: 14 14; }
.fy-road-done { fill: none; stroke: var(--gold-light); stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray .8s ease; }
.fy-node { position: absolute; transform: translate(-50%, -50%); background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: ProximaNova, sans-serif; color: #fff; padding: 0; }
.fy-node-dot { width: 62px; height: 62px; border-radius: 50%; background: #1a1a1a; border: 3px solid rgba(255,255,255,.45); display: flex; align-items: center; justify-content: center; color: #fff; transition: transform .15s; box-shadow: 0 6px 16px rgba(0,0,0,.5); }
.fy-node:hover .fy-node-dot, .fy-node:focus-visible .fy-node-dot { transform: scale(1.08); }
.fy-node:focus-visible { outline: none; } .fy-node:focus-visible .fy-node-dot { box-shadow: 0 0 0 4px rgba(240,201,23,.5); }
.fy-node-lbl { font-size: 13px; font-weight: 800; text-align: center; line-height: 1.15; max-width: 120px; background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 6px; }
.fy-node-lbl small { display: block; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); }

// ── EVENTS: FELLOW ────────────────────────────────────────────────
function fyBind() {
  const root = document.getElementById('fy-root'); if (!root) return;
  root.addEventListener('click', async e => {
    const t = e.target.closest('[data-action]'); if (!t || !t.dataset.action.startsWith('fy-')) return;
    const a = t.dataset.action;
    if (a === 'fy-resume') { FYUI.showResume = !FYUI.showResume; return renderFY(); }
    const top = () => { const r = document.getElementById('fy-root'); if (r) { const y = r.getBoundingClientRect().top + window.scrollY - 70; window.scrollTo({ top: Math.max(0, y), behavior: fyReduced() ? 'auto' : 'smooth' }); } };
    if (a === 'fy-go') { FYUI.view = t.dataset.to; FYUI.q = 0; FYUI.edit = null; FYUI.editMove = null; renderFY(); return top(); }
    if (a === 'fy-gonext') { FYUI.anim.stamp = FYUI.view; FYUI.view = t.dataset.to; FYUI.q = 0; FYUI.edit = null; FYUI.editMove = null; scheduleAutoSave(); renderFY(); return top(); }
    if (a === 'fy-map') { FYUI.view = 'map'; renderFY(); return top(); }
    if (a === 'fy-next') { FYUI.q = (FYUI.q || 0) + 1; renderFY(); return top(); }
    if (a === 'fy-prev') { FYUI.q = Math.max(0, (FYUI.q || 0) - 1); renderFY(); return top(); }
    if (a === 'fy-finish') { FYUI.anim.stamp = FYUI.view; FYUI.view = 'map'; FYUI.q = 0; FYUI.edit = null; scheduleAutoSave(); renderFY(); return top(); }
    if (a === 'fy-copy-resume') { await fyCopyResume(); return; }
    if (fyRO()) return;
    const fy = fyGet(); const ev = fyEventFor(S.fellow);
    const evd = ev ? (fy.events[ev.id] = fy.events[ev.id] || {}) : {};
    const card = id => fy.deck.find(c => c.id === id); const move = id => fy.moves.find(m => m.id === id);

  const base = r => [r.f.id, r.f.name, r.f.grade, pmName(r.f.pm), r.f.campus || ''];
  const H = ['fellow_id','fellow_name','grade','pm','campus'];
  const paths = a => (a || []).map(id => (FY.PATHS.find(p => p.id === id) || {}).label || id).join('; ');
  const shift = id => id ? ((FY.SHIFT.find(x => x.id === id) || {}).label || id) : '';
  let head, body = [];
  if (kind === 'summary') {
    head = [...H, ...FY.EVENTS.map(e => 'checked_in_' + e.id), 'cards','activities','multi_year','leadership','awards','hrs_per_wk_total','rubric_rating','guess','guess_vs_rating','rating_revealed','plan_9th_grade','moves','moves_in_motion','note_sealed','note_involved_by_may','note_explore','note_say_in_may'];
    rows.forEach(r => { const s = r.fy.level.self, d = r.st.level; const n = r.fy.note;
      body.push([...base(r), ...FY.EVENTS.map(e => !e.grades.includes(r.f.grade) ? 'n/a' : fyCheckinDone(e, r.fy.events[e.id]) ? 'yes' : 'no'),
        r.fy.deck.length, r.st.acts, r.st.multi, r.st.lead, r.st.awards, r.st.hours, r.fy.deck.length ? d : '', s || '', s && r.fy.deck.length ? (s === d ? 'matched' : s > d ? 'guessed higher' : 'guessed lower') : '', r.fy.level.revealed ? 'yes' : 'no',
        [(r.fy.plan9.types || []).map(t => fyType(t).label).join('; '), r.fy.plan9.text || ''].filter(Boolean).join(' · '),
        r.fy.moves.length, r.fy.moves.filter(m => (m.status || '') !== fyKind(m).statuses[0][0] && m.status !== 'notnow').length,
        n.sealed ? 'yes' : 'no', n.goal || '', n.explore || '', n.say || n.text || '']); });
  } else if (kind === 'reflections') {
    head = [...H, 'event','event_type','mood','mood_word','paths','plan_after_hs','today','campus','fit_1to5','what_stuck','alum','question','could_start_or_next','different_since_fall','proudest_card'];
    rows.forEach(r => FY.EVENTS.forEach(ev => { const e = r.fy.events[ev.id]; if (!e || !e.mood) return;
      const proud = r.fy.deck.find(c => c.id === e.proud);
      body.push([...base(r), ev.name, ev.kind, e.mood, e.word || '', paths(e.paths), e.plan ? (FY.PLAN.find(x => x.id === e.plan) || {}).label : '', shift(e.shift), e.campus || '', e.fit || '', e.quote || '', e.alum || '', e.question || '', e.steal || '', e.growth || '', proud ? proud.org : '']); }));
  } else if (kind === 'deck') {
    head = [...H, 'name','type','role_or_given_by','grades','hrs_per_wk','verbs','review','multi_year','leadership','added'];
    rows.forEach(r => r.fy.deck.forEach(c => body.push([...base(r), c.org || '', fyType(c.type).label, c.role || '', (c.grades || []).join('; '), c.type === 'award' ? '' : (c.hours || 0), (c.verbs || []).join('; '), c.flex || '', (c.grades || []).length >= 2 ? 'yes' : 'no', FY.LEAD_ROLES.includes(c.role) ? 'yes' : 'no', c.added || ''])));
  } else {
    head = [...H, 'kind','name','plan','status','first_step','first_step_by','past_due','why_it_matters','link','added','last_updated'];
    rows.forEach(r => r.fy.moves.forEach(m => body.push([...base(r), fyKind(m).short, m.name || '', m.plan || '', fyStatusLabel(m), m.step || '', m.due || '', fyMoveLate(m) ? 'yes' : 'no', m.why || '', m.link || '', m.added || '', m.updated || ''])));
  }
  const esc = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [head, ...body].map(r => r.map(esc).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = `${FY.CSV_PREFIX}_${kind === 'deck' ? 'activities' : kind}_${fyToday()}.csv`; document.body.appendChild(a); a.click(); a.remove();
}
function insBind() {
  const ins = document.getElementById('pm-insights'); if (!ins) return;
  ins.addEventListener('click', e => { const b = e.target.closest('[data-action="ins-dl"]'); if (b) insCSV(b.dataset.k); });
  ins.addEventListener('change', e => { if (e.target.id === 'ins-event') { INS_EVENT = e.target.value; renderInsights(); } });
}

// ══ TEAM VIEW ═════════════════════════════════════════════════════
let PMVIEW = 'list';
function renderPM() {
  const ae = fyActiveEvent();
  document.getElementById('pm-active-label').innerHTML = ae ? `<b>${fyEsc(ae.name)}</b> check-in is open for ${ae.grades.join(' & ')}` : 'No check-in is open';
  const list = document.getElementById('pm-fellow-list'); const filtered = pmFiltered();
  list.innerHTML = filtered.length ? filtered.map(f => `<div class="fellow-item" data-action="pm-open" data-fid="${f.id}">
      <div><div class="fellow-item-name">${fyEsc(f.name)}</div><div class="fellow-item-meta">${fyEsc(f.grade)} Grade · ${fyEsc(f.pm || '')} ${fyListBadge(f)}</div></div>
      <span class="fellow-arrow">&#8594;</span></div>`).join('') : '<div style="padding:20px;text-align:center;color:#999;font-size:14px;">No Fellows found</div>';
  if (PMVIEW === 'insights') renderInsights();
  if (PMVIEW === 'events') renderEventsAdmin();
}
function setPMView(v) {
  PMVIEW = v;
  document.querySelectorAll('.pm-viewtab').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.getElementById('pm-fellow-list').style.display = v === 'list' ? '' : 'none';
  document.getElementById('pm-insights').style.display = v === 'insights' ? '' : 'none';
  document.getElementById('pm-events').style.display = v === 'events' ? '' : 'none';
  renderPM();
}
function renderEventsAdmin() {
  const ae = fyActiveEvent();
  document.getElementById('pm-events').innerHTML = `<div class="ins-card"><h4>Which check-in is open?</h4>
    <p class="ins-sub">Fellows see the open check-in when they log in. Old check-ins stay saved on their passport. Switch this on event day.</p>
    ${FY.EVENTS.map(e => `<div class="ev-row${ae && ae.id === e.id ? ' on' : ''}"><div><b>${fyEsc(e.name)}</b><span>${fyEsc(e.when)} · ${e.grades.join(' & ')} · ${e.kind === 'tour' ? 'campus fit + moment' : e.kind === 'symposium' ? 'then vs. now, opens sealed notes' : 'alumni reflection'}</span></div>
      ${ae && ae.id === e.id ? '<span class="fy-badge ok">Open</span>' : `<button class="fy-btn ghost" data-action="ev-open" data-id="${e.id}">Open this one</button>`}</div>`).join('')}
    <div class="ev-row${!ae ? ' on' : ''}"><div><b>⏸ No check-in</b><span>Fellows can still add activities and work on their next move and note.</span></div>
      ${!ae ? '<span class="fy-badge ok">On</span>' : '<button class="fy-btn ghost" data-action="ev-open" data-id="none">Close check-ins</button>'}</div>
    <div class="fy-hint" id="ev-msg" style="margin-top:8px;"></div></div>`;
}


// ══ APP SHELL ═════════════════════════════════════════════════════
function show(view) { S.view = view; ['landing','fellow','pm'].forEach(v => document.getElementById('screen-' + v).classList.toggle('active', v === view)); window.scrollTo(0, 0); }
function openFellow(f) {
  S.fellow = f;
  document.getElementById('rh-name').textContent = f.name;
  document.getElementById('rh-meta').textContent = f.grade + ' Grade · ' + (fyRO() ? 'Team view' : 'Future You');
  document.getElementById('back-to-pm-btn').classList.toggle('hidden', !fyRO());
  show('fellow'); renderFY();
}
async function login() {
  const role = document.querySelector('.role-tab.active').dataset.role; const pin = document.getElementById('pin-input').value.trim();
  const err = document.getElementById('login-error'); err.textContent = '';
  const ls = document.getElementById('loading-screen');
  if (role === 'pm') {
    if (pin !== CONFIG.PASSWORDS.pm) { err.textContent = 'Incorrect password. Try again.'; return; }
    S.role = 'pm'; ls.classList.remove('hidden');
    const r = await apiFetch('loadAllFellows'); if (r && r.fellows) Object.entries(r.fellows).forEach(([id, d]) => { if (d) S.data[id] = d; });
    ls.classList.add('hidden'); show('pm'); setPMView(PMVIEW); return;
  }
  if (!S.pick) { err.textContent = 'Find your name first.'; return; }
  if (S.pick.hasPin) { const r = await apiFetch('checkPin', { fellowId: S.pick.id, pin }); if (!r || !r.ok) { err.textContent = "That PIN doesn't match. Ask your PM."; return; } }
  else if (pin !== CONFIG.PASSWORDS.fellow) { err.textContent = 'Incorrect password. Try again.'; return; }
  S.role = 'fellow'; ls.classList.remove('hidden');
  const r = await apiFetch('loadFellow', { fellowId: S.pick.id }); if (r && r.data) S.data[S.pick.id] = r.data;
  ls.classList.add('hidden'); openFellow(S.pick);
}
function bindShell() {
  const inp = document.getElementById('fellow-search'); const dd = document.getElementById('fellow-dd');
  inp.addEventListener('input', () => { const q = inp.value.toLowerCase().trim(); if (!q) { dd.classList.remove('open'); return; }
    const m = FELLOWS.filter(f => f.name.toLowerCase().includes(q)).slice(0, 8);
    dd.innerHTML = m.map(f => `<div class="fellow-option" data-action="sel-fellow" data-fid="${f.id}">${fyEsc(f.name)}<span class="grade-badge">${fyEsc(f.grade)}</span></div>`).join('');
    dd.classList.toggle('open', m.length > 0); });
  document.addEventListener('click', async e => {
    if (!inp.contains(e.target) && !dd.contains(e.target)) dd.classList.remove('open');
    const t = e.target.closest('[data-action]'); if (!t) return; const a = t.dataset.action;
    if (a === 'sel-fellow') { const f = FELLOWS.find(x => x.id === t.dataset.fid); S.pick = f; inp.value = ''; dd.classList.remove('open');
      document.getElementById('sel-name').textContent = f.name; document.getElementById('sel-grade').textContent = f.grade + ' Grade';
      document.getElementById('sel-display').classList.add('visible');
      document.getElementById('pin-input').placeholder = f.hasPin ? 'Your PIN' : 'Password'; }
    if (a === 'clear-fellow') { S.pick = null; document.getElementById('sel-display').classList.remove('visible'); }
    if (a === 'logout') { S.fellow = null; S.pick = null; S.role = 'fellow'; document.getElementById('pin-input').value = ''; document.getElementById('sel-display').classList.remove('visible');
      document.querySelectorAll('.role-tab').forEach(x => x.classList.toggle('active', x.dataset.role === 'fellow')); document.getElementById('fellow-login-fields').style.display = 'block'; show('landing'); }
    if (a === 'back-to-pm') { S.fellow = null; show('pm'); renderPM(); }
    if (a === 'pm-open') { const f = FELLOWS.find(x => x.id === t.dataset.fid); if (f) openFellow(f); }
    if (a === 'ev-open') { const msg = document.getElementById('ev-msg'); if (msg) msg.textContent = 'Saving…';
      const r = await apiFetch('saveConfig', { config: { activeEvent: t.dataset.id } }); if (r && r.ok) { S.config.activeEvent = t.dataset.id; renderPM(); } else if (msg) msg.textContent = 'Could not save. Try again.'; }
  });
  document.querySelectorAll('.role-tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.role-tab').forEach(x => x.classList.remove('active')); t.classList.add('active');
    const pm = t.dataset.role === 'pm'; document.getElementById('fellow-login-fields').style.display = pm ? 'none' : 'block';
    document.getElementById('login-btn').textContent = pm ? 'Open Team Dashboard' : 'Open Future You'; }));
  document.getElementById('login-btn').addEventListener('click', login);
  document.getElementById('pin-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.getElementById('pm-viewtabs').addEventListener('click', e => { const b = e.target.closest('.pm-viewtab'); if (b) setPMView(b.dataset.view); });
  ['pm-search','pm-grade-sel','pm-pm-filter'].forEach(id => document.getElementById(id).addEventListener(id === 'pm-search' ? 'input' : 'change', renderPM));
}
async function init() {
  bindShell(); fyBind(); insBind();
  const [r, c] = await Promise.all([apiFetch('loadRoster'), apiFetch('loadConfig')]);
  FELLOWS = ((r && r.fellows) || []).filter(f => f.name).map(f => ({ ...f, grade: (String(f.grade || '').match(/\d+/) || [''])[0] ? (String(f.grade).match(/\d+/)[0] + 'th') : String(f.grade || '').trim() }));
  S.config = (c && c.config) || {};
  const pms = [...new Set(FELLOWS.map(f => f.pm).filter(Boolean))].sort();
  document.getElementById('pm-pm-filter').innerHTML = '<option value="">All PMs</option>' + pms.map(p => `<option>${fyEsc(p)}</option>`).join('');
  document.getElementById('loading-screen').classList.add('hidden');
}
init();

</script>
